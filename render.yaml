services:
  - type: web
    name: woso-fan-community
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    disk:
      name: woso-uploads
      mountPath: /var/www/html/uploads
      sizeGB: 1
    envVars:
      - key: WOSO_DB_HOST
        sync: false
      - key: WOSO_DB_PORT
        value: "3306"
      - key: WOSO_DB_NAME
        sync: false
      - key: WOSO_DB_USER
        sync: false
      - key: WOSO_DB_PASSWORD
        sync: false
      - key: WOSO_RESEND_API_KEY
        sync: false
      - key: WOSO_EMAIL_FROM
        sync: false
      - key: WOSO_GOOGLE_SIGN_IN_ENABLED
        value: "false"
      - key: WOSO_GOOGLE_CLIENT_ID
        sync: false
      - key: WOSO_GOOGLE_CLIENT_SECRET
        sync: false
      - key: WOSO_GOOGLE_REDIRECT_URI
        value: https://woso-fan-community.onrender.com/google_callback.php
      - key: WOSO_APP_BASE_URL
        value: https://woso-fan-community.onrender.com
      - key: WOSO_THESPORTSDB_LEAGUE_IDS
        value: "4521,4849,5106,5203,5205,5204,5209,5208,4889"
