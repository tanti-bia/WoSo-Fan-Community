<Directory /var/www/html>
	Options -Indexes
	AllowOverride All
	Require all granted
</Directory>

<Directory /var/www/html/uploads>
	Options -Indexes
	AllowOverride None
	<FilesMatch "(?i)\.(php|phtml|php[0-9]?|phps)$">
		Require all denied
	</FilesMatch>
</Directory>

<FilesMatch "(?i)\.(sql|md|ini|env|log)$">
	Require all denied
</FilesMatch>
